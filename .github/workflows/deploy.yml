# Cloudflare Pages deployment workflow
name: Deploy to Cloudflare Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Only the source checkout is needed; the GitHub Pages id-token/pages
# permissions went away with the Pages deployment.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress runs — production
# deployments should be allowed to finish.
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The site is plain static HTML — no build step. Stage only the files that
      # should be served, so repo furniture (CNAME, LICENSE, README) is not
      # published. CNAME in particular is a GitHub Pages artifact with no meaning
      # on Cloudflare Pages.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude 'CNAME' \
            --exclude 'LICENSE' \
            --exclude 'README.md' \
            --exclude '_site' \
            ./ _site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=elsanjose-com --branch=main
